<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0b0f1d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070913" stop-opacity="1"/>
    </radialGradient>

    <!-- Ribbon 1: Electric Indigo to Cyan -->
    <linearGradient id="primaryFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Ribbon 2: Radiant Violet to Magenta -->
    <linearGradient id="secondaryFlow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent Glow Core -->
    <linearGradient id="coreSpark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Dimensional Weaving -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container / App Icon Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.22" filter="blur(40px)"/>
  <circle cx="280" cy="230" r="90" fill="#06b6d4" opacity="0.2" filter="blur(30px)"/>

  <!-- Main Emblem Group -->
  <g filter="url(#layerShadow)">
    <!-- Back Loop: Geometric Fusion Arc (Lower Stem & Base Loop) -->
    <path d="M 170 360 C 140 360 116 336 116 306 L 116 196 C 116 142 160 98 214 98 L 330 98 C 364 98 392 126 392 160 C 392 194 364 222 330 222 L 230 222 C 206 222 186 242 186 266 L 186 344 C 186 353 179 360 170 360 Z"
          fill="url(#primaryFlow)"/>

    <!-- Gloss Layer for Back Loop -->
    <path d="M 170 360 C 140 360 116 336 116 306 L 116 196 C 116 142 160 98 214 98 L 330 98 C 364 98 392 126 392 160 C 392 194 364 222 330 222 L 230 222 C 206 222 186 242 186 266 L 186 344 C 186 353 179 360 170 360 Z"
          fill="url(#glassGloss)"/>

    <!-- Front Interlocking Ribbon: Upper Bar & Diagonal Fusion Stream -->
    <path d="M 342 152 L 234 152 C 200 152 172 180 172 214 L 172 320 C 172 368 211 408 260 408 L 320 408 C 354 408 382 380 382 346 C 382 312 354 284 320 284 L 252 284 C 238 284 226 272 226 258 C 226 244 238 232 252 232 L 342 232 C 372 232 396 208 396 178 C 396 164 372 152 342 152 Z"
          fill="url(#secondaryFlow)" filter="url(#layerShadow)"/>

    <!-- High-Tech Energy Spark Core (Central Fusion Nexus) -->
    <g transform="translate(256, 256)">
      <!-- Outer Pulsing Diamond Ring -->
      <polygon points="0,-48 48,0 0,48 -48,0" fill="none" stroke="url(#coreSpark)" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
      <!-- Inner Glowing Core -->
      <polygon points="0,-26 26,0 0,26 -26,0" fill="url(#coreSpark)" opacity="0.95"/>
      <!-- Specular Center Star -->
      <circle cx="0" cy="0" r="8" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)"/>
    </g>

    <!-- Forward Cyber Stream Nodes -->
    <circle cx="340" cy="116" r="10" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
    <circle cx="330" cy="408" r="9" fill="#e879f9" filter="drop-shadow(0 0 6px #e879f9)"/>
  </g>
</svg>
