<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <radialGradient id="bgVault" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181336" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0c0e1a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06070d" stop-opacity="1"/>
    </radialGradient>

    <!-- Top Isometric Prism Layer (Cyan/Teal) -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Left Prism Layer (Electric Indigo) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Right Prism Layer (Radiant Purple/Violet) -->
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glowing Hex Core -->
    <linearGradient id="hexCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="vaultShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgVault)" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="130" fill="#6366f1" opacity="0.25" filter="blur(36px)"/>

  <!-- Isometric Vault Prism Geometry -->
  <g filter="url(#vaultShadow)" transform="translate(256, 256)">

    <!-- Outer Hexagonal Data Shield Facets -->
    <!-- Top Wing -->
    <polygon points="0,-160 138,-80 0,0 -138,-80" fill="url(#facetTop)" opacity="0.95"/>
    <polygon points="0,-160 138,-80 0,0 -138,-80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

    <!-- Left Wing (Files / Data stream) -->
    <polygon points="-138,-80 0,0 0,160 -138,80" fill="url(#facetLeft)" opacity="0.95"/>
    <polygon points="-138,-80 0,0 0,160 -138,80" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Right Wing (Vault / Security stream) -->
    <polygon points="0,0 138,-80 138,80 0,160" fill="url(#facetRight)" opacity="0.95"/>
    <polygon points="0,0 138,-80 138,80 0,160" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Central Levitating Fusion Core (Cutout Crystal) -->
    <g transform="scale(0.55)">
      <!-- Top -->
      <polygon points="0,-130 112,-65 0,0 -112,-65" fill="#ffffff" opacity="0.95"/>
      <!-- Left -->
      <polygon points="-112,-65 0,0 0,130 -112,65" fill="#38bdf8" opacity="0.9"/>
      <!-- Right -->
      <polygon points="0,0 112,-65 112,65 0,130" fill="#f43f5e" opacity="0.9"/>
    </g>

    <!-- Keyhole / Secret Chamber Center Glyph -->
    <circle cx="0" cy="0" r="14" fill="#ffffff" filter="drop-shadow(0 0 10px #ffffff)"/>
    <polygon points="-5,0 5,0 8,24 -8,24" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)"/>

    <!-- Dynamic Orbital Data Particles -->
    <circle cx="100" cy="-60" r="6" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
    <circle cx="-100" cy="60" r="6" fill="#818cf8" filter="drop-shadow(0 0 6px #818cf8)"/>
    <circle cx="90" cy="90" r="6" fill="#f43f5e" filter="drop-shadow(0 0 6px #f43f5e)"/>
  </g>
</svg>
